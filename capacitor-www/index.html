<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="viewport-fit=cover, width=device-width, initial-scale=1"
    />
    <title>Bodhi Path</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        font-family: system-ui, sans-serif;
        background: #1a2418;
        color: #f3e9d7;
        padding: 1.5rem;
        text-align: center;
      }
      p {
        max-width: 28rem;
        line-height: 1.5;
        opacity: 0.85;
      }
      code {
        font-size: 0.85em;
        word-break: break-all;
      }
    </style>
  </head>
  <body>
    <div>
      <h1>Bodhi Path</h1>
      <p>
        Set <code>CAPACITOR_SERVER_URL</code> (or
        <code>NEXT_PUBLIC_APP_URL</code>) to your deployed Next.js HTTPS origin,
        then run <code>npm run cap:sync</code>.
      </p>
    </div>
  </body>
</html>
